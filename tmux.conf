# ~/.config/tmux/tmux.conf

# Change prefix to Ctrl-A.
set-option -g prefix C-a

# Use vi-style key bindings.
set-option -g mode-keys vi
set-option -g status-keys vi

# Attempt to set the client terminal title.
set-option -g set-titles on

# Allow automatic window renaming, renumber windows when one is closed,
# and keep session alive when last window is destroyed.
set-option -g allow-rename on
set-option -g renumber-windows on
set-option -g detach-on-destroy off

# Enable mouse support, monitor window activity, and handle focus
# events.
set-option -g mouse on
set-option -g monitor-activity on
set-option -g focus-events on

# Remove escape delay, increase history, and enable clipboard
# integration.
set-option -g escape-time 0
set-option -g history-limit 10000
set-option -g set-clipboard on

# Enable 256 colors and true color support.
# PS: Can be removed on newest tmux version.
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

# Make status bar transparent.
set-option -g status-style "bg=default"

# Send literal prefix, switch to last window, reload config, and kill
# operations.
bind-key a send-prefix
bind-key C-a last-window
bind-key r source-file "~/.config/tmux/tmux.conf" \; \
	display-message "tmux.conf re-sourced"
bind-key x kill-pane
bind-key C-x confirm-before kill-server

# Create new session and show session tree with and without windows
# expanded.
bind-key C new-window
bind-key w choose-tree -Zw
bind-key C-w choose-tree -Zs

# Window and pane creation with current path inheritance.
bind-key c new-window -c "#{pane_current_path}"
bind-key s split-window -c "#{pane_current_path}"
bind-key C-s split-window -c "#{pane_current_path}"
bind-key v split-window -hc "#{pane_current_path}"
bind-key C-v split-window -hc "#{pane_current_path}"

# Vi-style pane navigation using hjkl keys.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vi-style pane swapping using HJKL keys.
bind-key H swap-pane -d -t "{left-of}"
bind-key J swap-pane -d -t "{down-of}"
bind-key K swap-pane -d -t "{up-of}"
bind-key L swap-pane -d -t "{right-of}"

# Repeatable pane resizing with Prefix-Ctrl+hjkl.
bind-key -r C-h resize-pane -L 6
bind-key -r C-j resize-pane -D 3
bind-key -r C-k resize-pane -U 3
bind-key -r C-l resize-pane -R 6

# Repeatable window navigation with Prefix-Ctrl-n and Prefix-Ctrl-p, and
# reordering with Prefix-N and Prefix-P.
bind-key -r C-n next-window
bind-key -r C-p previous-window
bind-key -r N swap-window -t :+ \; select-window -t :+
bind-key -r P swap-window -t :- \; select-window -t :-

# Goto next and prev prompt in visual mode with ] and [.
bind-key -T copy-mode-vi [ send-keys -X next-prompt
bind-key -T copy-mode-vi ] send-keys -X previous-prompt

# In visual mode, start normal selection with v, lines selection with V
# and rectangle selection with Ctrl-v. Copy selected text with y. Copy
# to end-of-line with Y without selecting text.
bind-key -T copy-mode-vi v send-keys -X begin-selection \; \
	send-keys -X rectangle-off
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; \
	send-keys -X rectangle-on
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line

# Disable default mouse behaviors that interfere with manual copy
# operations.
unbind-key -T copy-mode-vi MouseDragEnd1Pane
unbind-key -n MouseDown3Pane
